stages:
  - build
  - deploy

variables:
  REGISTRY: $CI_REGISTRY
  IMAGE_PREFIX: $CI_REGISTRY_IMAGE

.build_template: &build_template
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker build \
        -t $IMAGE_PREFIX/$SERVICE_NAME:latest \
        -t $IMAGE_PREFIX/$SERVICE_NAME:$CI_COMMIT_SHA \
        $BUILD_CONTEXT
    - docker push $IMAGE_PREFIX/$SERVICE_NAME:latest
    - docker push $IMAGE_PREFIX/$SERVICE_NAME:$CI_COMMIT_SHA
  only:
    - main

build-backend:
  <<: *build_template
  variables:
    SERVICE_NAME: backend
    BUILD_CONTEXT: ./backend

build-frontend:
  <<: *build_template
  variables:
    SERVICE_NAME: frontend
    BUILD_CONTEXT: ./frontend

build-taskmanagement:
  <<: *build_template
  variables:
    SERVICE_NAME: taskmanagement
    BUILD_CONTEXT: ./taskmanagement

deploy-taskmanagement:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SERVER_PRIVATE_KEY" > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -p 22 194.233.94.36 >> ~/.ssh/known_hosts
  script:
    - |
      ssh -i ~/.ssh/deploy_key -p 22 root@194.233.94.36 "
        cd ~/k1m0ch1/kube-workshop &&
        git pull &&
        cd taskmanagement &&
        docker compose down &&
        docker compose up -d --build
      "
  only:
    - main
  needs:
    - build-taskmanagement
