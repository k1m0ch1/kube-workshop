stages:
  - build

variables:
  REGISTRY: $CI_REGISTRY
  IMAGE_PREFIX: $CI_REGISTRY_IMAGE

.build_template: &build_template
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker build \
        -t $IMAGE_PREFIX/$SERVICE_NAME:latest \
        -t $IMAGE_PREFIX/$SERVICE_NAME:$CI_COMMIT_SHA \
        $BUILD_CONTEXT
    - docker push $IMAGE_PREFIX/$SERVICE_NAME:latest
    - docker push $IMAGE_PREFIX/$SERVICE_NAME:$CI_COMMIT_SHA
  only:
    - main

build-backend:
  <<: *build_template
  variables:
    SERVICE_NAME: backend
    BUILD_CONTEXT: ./backend

build-frontend:
  <<: *build_template
  variables:
    SERVICE_NAME: frontend
    BUILD_CONTEXT: ./frontend
