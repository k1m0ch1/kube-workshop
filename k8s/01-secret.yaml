# SECRET
# A Secret stores sensitive config (passwords, tokens) separately from your
# app code/images. Values here must be base64-encoded (this is NOT encryption,
# just encoding — real clusters should also enable encryption-at-rest/RBAC).
# `echo -n admin | base64` produces the value below.
apiVersion: v1
kind: Secret
metadata:
  name: employee-app-secret
  namespace: kube-workshop
type: Opaque
data:
  ADMIN_USER: YWRtaW4=      # "admin"
  ADMIN_PASSWORD: YWRtaW4=  # "admin"
