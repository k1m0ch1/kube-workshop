services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # To build using SSH git clone from a private repo:
      #   docker compose build --ssh default
      # ssh:
      #   - default
    image: taskmanagement:latest
    container_name: taskmanagement
    ports:
      - "8080:80"
    volumes:
      # Persist SQLite database across restarts
      - db_data:/var/www/html/database
      # Persist storage (uploads, logs, cache)
      - app_storage:/var/www/html/storage
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Optional: Use MySQL instead of SQLite
  # db:
  #   image: mysql:8.0
  #   container_name: taskmanagement_db
  #   environment:
  #     MYSQL_ROOT_PASSWORD: secret
  #     MYSQL_DATABASE: taskmanagement
  #     MYSQL_USER: laravel
  #     MYSQL_PASSWORD: secret
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   ports:
  #     - "3306:3306"

volumes:
  db_data:
  app_storage:
  # mysql_data:
