services:

  # --- PHP Application (Laravel) ---
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: taskmanagement
      DB_USERNAME: laravel
      DB_PASSWORD: secret

  # --- Web Server ---
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # --- Database ---
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: taskmanagement
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
